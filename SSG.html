<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Orodan's Satuts</title>
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="SSG Style.css">
    </head>
    <body>
        <p>Name: Orodan Wainwright</p>
        <p>Age: 17</p>
        <p>
            <span>Title 1:</span>
            <input type="text" id="title1">
        </p>
        <p>
            <span>Title 2:</span>
            <input type="text" id="title2">
        </p>
        <p>
            <span>Title 3:</span>
            <input type="text" id="title3">
        </p>
        <p>
            <span>Title 4:</span>
            <input type="text" id="title4">
        </p>

        <label>Create Title</label>
        <input type="text" id="newTitle">
        <button id="titleBtn">+</button>

        <p>Available Titles:</p>
        <div id="availableTitles"></div>
        
        <div>
            <label>Create Skill</label>
            <input type="text" name="skillName" id="skillName">
            <label>Level:</label>
            <input type="number" id="levelInput">
            <label>Chose Rarity</label>
            <select id="Rarity">
                <option value="Common">Common</option>
                <option value="Uncommon">Uncommon</option>
                <option value="Rare">Rare</option>
                <option value="Exquisite">Exquisite</option>
                <option value="Legendary">Legendary</option>
                <option value="Mythical">Mythical</option>
                <option value="Celestial">Celestial</option>
            </select>
            <lable>|</lable>
            <button id="addSkill">Add Skill</button>
        </div>
        <span id="Celestial">Celestial:</span>
        <hr/>
        <span id="Mythical">Mythical:</span>
        <hr/>
        <span id="Legendary">Legendary:</span>
        <hr/>
        <span id="Exquisite">Exquisite:</span>
        <hr/>
        <span id="Rare">Rare:</span>
        <hr/>
        <span id="Uncommon">Uncommon:</span>
        <hr/>
        <span id="Common">Common:</span>
    </body>
    <script src="SSG.JS"></script>
</html>
